name: Refresh award availability

on:
  schedule:
    - cron: "5 16 * * *"   # 00:05 HKT, just after Cathay's daily calendar refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch availability snapshot
        run: python3 scripts/fetch_availability.py --concurrency 6

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/avail.json
          if git diff --staged --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "chore: refresh availability $(date -u +%F)"
            git push
          fi
